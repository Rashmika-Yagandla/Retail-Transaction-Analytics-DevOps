services:
  backend:
    build: ./backend
    container_name: retail-analytics-backend
    restart: unless-stopped
    expose: ["5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build: ./frontend
    container_name: retail-analytics-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:5000
    ports: ["3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
